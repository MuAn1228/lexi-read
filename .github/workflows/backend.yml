name: Backend tests
on:
  push:
    branches: [main]
    paths: ["backend/**", "scripts/**", "requirements.txt", ".github/workflows/backend.yml"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: offline
      APP_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest backend/tests -q
