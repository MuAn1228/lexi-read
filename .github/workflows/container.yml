name: Linux OCR container
on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "requirements*.txt", "backend/ocr/**", "scripts/serve_public.py", ".github/workflows/container.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux CPU image
        run: docker build --tag lexi-read:check .
      - name: Verify actual OCR in Linux container
        run: docker run --rm -e APP_MODE=local -e LLM_PROVIDER=offline -e DATA_DIR=/tmp/lexi-check lexi-read:check python scripts/ocr_smoke.py
